[package]
name = "thebes-lib"
version = "1.0.0"
description = "Thebes Protocol Motoko backend library — Admin (controller-gated operations), MemphisAuth (passkey session verification), Users (roles, profiles, avatars), Pagination (bounded list reads), Invoices (recomputed totals and lifecycle), and Media (certified on-chain images with chunked upload, dedup, quotas and typed refusals). The single backend library every Thebes example dapp depends on."
repository = "https://github.com/Mercatura-Forum/thebes-lib"
keywords = ["thebes", "egypt-l1", "motoko", "auth", "admin", "media"]
license = "Apache-2.0"

[dependencies]
core = "2.5.0"

[toolchain]
moc = "1.4.1"
