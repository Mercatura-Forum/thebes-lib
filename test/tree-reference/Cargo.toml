[package]
name = "tree-reference"
version = "0.1.0"
edition = "2021"

# Host-side byte-for-byte reference check for the Media.mo certified-tree port. Wraps a
# byte-identical COPY of ../src/asset_tree.rs (the copy is md5-guarded by
# test/run-tree-reference.sh) in a script-driven CLI that prints root/witness
# hex lines. The Motoko side prints the same lines from the same scripts;
# the gate is a byte-identical diff.

[dependencies]
sha2 = { version = "0.10", default-features = false }

[[bin]]
name = "tree-reference"
path = "src/main.rs"
